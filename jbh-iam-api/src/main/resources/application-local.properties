# Actuator
management.endpoints.web.exposure.include=*
# Logging
logging.level.root=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data=INFO
logging.level.org.springframework.web.servlet.resource=INFO
logging.level.liquibase=INFO
spring.jpa.show-sql=false
spring.insights.web.log-request-details=false
##s Internal JBH Packages LOGGIN
logging.level.com.jbh.gateway.internal=DEBUG
logging.level.com.jbh.iam.cache=DEBUG
logging.level.com.jbh.iam.domain.modules.user.service.UserServiceImpl=DEBUG
logging.level.com.jbh.iam.api.components.users.UserInfoController=DEBUG
logging.level.com.jbh.iam.cache.application.service=DEBUG
logging.level.com.jbh.iam.api.services.users=DEBUG
logging.level.com.jbh.iam.api.services.users.UserServiceImpl=DEBUG

# Security
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web.FilterChainProxy=INFO

# Spring Dev Tools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

