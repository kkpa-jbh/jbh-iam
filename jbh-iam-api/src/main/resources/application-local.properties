# Actuator
management.endpoints.web.exposure.include=*
# Logging
logging.level.root=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data=INFO
logging.level.org.springframework.web.servlet.resource=INFO
logging.level.liquibase=INFO
spring.jpa.show-sql=false
spring.insights.web.log-request-details=false
# Security
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web.FilterChainProxy=INFO
# JBH Gateway Client
logging.level.com.jbh.gateway.internal=DEBUG
# Spring Dev Tools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.remote.secret=mysecret

