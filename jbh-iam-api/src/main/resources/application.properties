management.endpoints.web.exposure.include=health,info,prometheus
# Tags on every metric, like jbh-personal-finance (service, env). The prod profile sets the env default to prod.
management.metrics.tags.service=jbh-iam
management.metrics.tags.env=${JBH_ENV:dev}
# Latency buckets for http.server.requests (whole ms; 2.5s is 2500ms). No percentiles-histogram: too many series.
management.metrics.distribution.slo[http.server.requests]=5ms,10ms,25ms,50ms,100ms,250ms,500ms,1000ms,2500ms,5000ms,10000ms

# OpenTelemetry. OTEL_SDK_DISABLED controls only the export. Trace ids stay in logs and in outgoing calls.
# Export is on only when OTEL_SDK_DISABLED=false. Unset or any other value: off.
jbh.otel.export-enabled-when-sdk-disabled.true=false
jbh.otel.export-enabled-when-sdk-disabled.false=true
jbh.otel.export-enabled=${jbh.otel.export-enabled-when-sdk-disabled.${OTEL_SDK_DISABLED:true}:false}
management.otlp.tracing.export.enabled=${jbh.otel.export-enabled}
management.otlp.logging.export.enabled=${jbh.otel.export-enabled}
# gRPC to Alloy: no path in the endpoint. Docker: http://jbh-alloy:4317
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:14317}
management.otlp.tracing.transport=grpc
management.otlp.logging.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:14317}
management.otlp.logging.transport=grpc
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:1.0}
management.tracing.baggage.enabled=false
management.opentelemetry.resource-attributes[service.namespace]=jbh
management.opentelemetry.resource-attributes[deployment.environment.name]=${JBH_ENV:dev}
management.opentelemetry.resource-attributes[service.version]=${JBH_SERVICE_VERSION:unknown}
logging.structured.ecs.service.version=${JBH_SERVICE_VERSION:unknown}

# Gateway Client Configuration
jbh.gateway.base-url=${JBH_GATEWAY_URL:http://localhost:8080}
