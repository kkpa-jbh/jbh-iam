# Server Configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.env=${JBH_ENV:prod}
management.opentelemetry.resource-attributes[deployment.environment.name]=${JBH_ENV:prod}
logging.structured.ecs.service.environment=${JBH_ENV:prod}
# Logging Configuration
logging.level.root=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.web=ERROR
logging.level.liquibase=ERROR
spring.jpa.show-sql=false
