# Server Configuration
hostname: ${INSTANCE_HOSTNAME:localhost}
server:
  port: ${INSTANCE_PORT:9999}
  servlet:
    #context-path: ${INSTANCE_CONTEXT_PATH:/jbh}
    context-path: ${INSTANCE_CONTEXT_PATH:/}
  compression:
    enabled: true

# Spring Security JWT
app:
  jwtSecret: ${JWT_SECRET:p7YH4n3B6GZC6FvJBHm9a0YzqkXyZP8vJBH1F0sYB7Q=}
  # Short-lived access token - 15 minutes
  jwtExpirationInMs: ${JWT_EXPIRATION_IN_MS:900000}
  # Long-lived refresh token - 30 days
  refreshTokenExpirationInMs: ${REFRESH_TOKEN_EXPIRATION_IN_MS:2592000000}

# JBH Cache Configuration
jbh:
  cache:
    user:
      max-size: ${CACHE_USER_MAX_SIZE:5000}
      expire-after-write-minutes: ${CACHE_USER_EXPIRE_WRITE_MINUTES:60}
      expire-after-access-minutes: ${CACHE_USER_EXPIRE_ACCESS_MINUTES:30}
      enabled: ${CACHE_USER_ENABLED:true}

spring:
  profiles:
    active: local
  application:
    name: jbh-iam-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${hostname}:5432/${DB_NAME:jbh}
    username: jbh_admin
    password: ${JBH_ADMIN_PASS:xxxxx}
  cloud:
    consul:
      host: ${hostname}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        #health-check-path: ${INSTANCE_CONTEXT_PATH:/jbh}/actuator/health
        health-check-path: /actuator/health
        health-check-interval: 60s
        prefer-ip-address: false
        instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false
    time-zone: UTC
    date-format: yyyy-MM-dd
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    database: postgresql
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        temp:
          use_jdbc_metadata_defaults: false
    generate-ddl: false
    # It's managed by liquibase, that's why its value its none.
    hibernate:
      ddl-auto: none
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
  mvc:
    pathmatch:
      # To Fix: No more pattern data allowed after {*...} or ** pattern element
      matching-strategy: ANT_PATH_MATCHER
