# Server Configuration
# Fallback host for Postgres and Consul. DB_HOST and CONSUL_HOST override each one (Docker needs two hosts).
hostname: ${INSTANCE_HOSTNAME:localhost}
server:
  port: ${INSTANCE_PORT:9999}
  servlet:
    #context-path: ${INSTANCE_CONTEXT_PATH:/jbh}
    context-path: ${INSTANCE_CONTEXT_PATH:/}
  compression:
    enabled: true

# Spring Security JWT
app:
  # Required, no default: Base64, at least 32 bytes. Same value as jbh-gateway.
  jwtSecret: ${JBH_JWT_SECRET}
  # Short-lived access token - 15 minutes
  jwtExpirationInMs: ${JWT_EXPIRATION_IN_MS:900000}
  # Long-lived refresh token - 30 days
  refreshTokenExpirationInMs: ${REFRESH_TOKEN_EXPIRATION_IN_MS:2592000000}
  # Google OAuth client IDs accepted as ID token audience, comma separated (web, android, ios).
  # Default is the public JBH web client ID. Set GOOGLE_CLIENT_IDS to an empty value to turn Google sign-in off.
  googleClientIds: ${GOOGLE_CLIENT_IDS:191326239101-d9dlh362qavadjid6cbi5prqv679npku.apps.googleusercontent.com}
  # Browser origins allowed to call IAM (CORS), comma separated. Default: local dev servers.
  # Production sets CORS_ALLOWED_ORIGINS=https://jbh.usemagus.cloud (jbh-deploy compose.yaml).
  corsAllowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8100,http://127.0.0.1:4200,http://127.0.0.1:8100}

# JBH Cache Configuration
jbh:
  cache:
    user:
      max-size: ${CACHE_USER_MAX_SIZE:5000}
      expire-after-write-minutes: ${CACHE_USER_EXPIRE_WRITE_MINUTES:60}
      expire-after-access-minutes: ${CACHE_USER_EXPIRE_ACCESS_MINUTES:30}
      enabled: ${CACHE_USER_ENABLED:true}

spring:
  profiles:
    active: local
  application:
    name: jbh-iam-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:${hostname}}:${DB_PORT:5432}/${DB_NAME:jbh}
    username: ${DB_USERNAME:jbh_admin}
    password: ${JBH_ADMIN_PASS}
  cloud:
    consul:
      host: ${CONSUL_HOST:${hostname}}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        #health-check-path: ${INSTANCE_CONTEXT_PATH:/jbh}/actuator/health
        health-check-path: /actuator/health
        health-check-interval: 60s
        prefer-ip-address: false
        # The name the gateway uses to reach this service. In Docker it must be the compose service name (jbh-iam).
        hostname: ${CONSUL_DISCOVERY_HOSTNAME:localhost}
        instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false
    time-zone: UTC
    date-format: yyyy-MM-dd
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    database: postgresql
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        temp:
          use_jdbc_metadata_defaults: false
    generate-ddl: false
    # It's managed by liquibase, that's why its value its none.
    hibernate:
      ddl-auto: none
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
  mvc:
    pathmatch:
      # To Fix: No more pattern data allowed after {*...} or ** pattern element
      matching-strategy: ANT_PATH_MATCHER
