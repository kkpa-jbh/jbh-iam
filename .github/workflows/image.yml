# Image: builds the jbh-iam Docker image and pushes it to GHCR (GitHub Container Registry).
# It runs after each merge into main, or by hand.
# Steps: run the tests, show the coverage, build the boot jar, build and push the image,
# then delete old images.
# Each image gets two tags: the git SHA (used by jbh-deploy, so a deploy can pin it) and "latest".
# jbh-gateway-client must be published to GitHub Packages first (jbh-gateway-client repo).

# The name shown in the GitHub "Actions" tab.
name: Image

on:
  # Adds a "Run workflow" button in the Actions tab, to build an image by hand.
  workflow_dispatch:
  # Runs on every push to main. A merged PR is a push to main, so this runs after each merge.
  push:
    branches: [ main ]

# What the automatic GITHUB_TOKEN may do in this run. Every permission not listed is "none".
# - contents: read   -> download the code.
# - packages: write  -> push the image to GHCR and delete old image versions.
permissions:
  contents: read
  packages: write

# No "concurrency" block: two quick pushes to main run two builds side by side.
# Each one pushes its own SHA tag, and the one that ends last also sets "latest".

jobs:
  # "image" is the job id. Each job gets a fresh, empty Ubuntu VM that is deleted after.
  image:
    runs-on: ubuntu-latest
    steps:
      # The VM starts empty. This step downloads the code of the pushed commit into it.
      # Actions are pinned to a full commit SHA (the version is in the comment), so a moved tag cannot change them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Installs Java 21 (Temurin build). Gradle runs on it; the Kotlin code still targets JVM 17.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # Sets up Gradle and caches its files between runs, so dependencies are not downloaded again each time.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # PACKAGES_READ_TOKEN turns on the GitHub Packages repositories in build.gradle.kts.
      # Unit tests need no network. One integration test starts Postgres with Testcontainers (Docker is on the runner).
      # A failed test stops the image.
      # --no-daemon: no Gradle background process; the VM is deleted after the run anyway.
      - name: Run tests
        run: ./gradlew --no-daemon test
        env:
          # The GitHub user that started the run. build.gradle.kts uses it as the GitHub Packages user name.
          GITHUB_ACTOR: ${{ github.actor }}
          # Repo secret: a classic token with only read:packages. It reads jbh-gateway-client
          # and the notification contracts, which live in other repos' packages.
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      # Adds up the lines of all modules (JaCoCo CSV: column 8 = missed, column 9 = covered).
      # awk -F, : split each line on commas. Rows with GROUP are the header lines and are skipped.
      # tee -a "$GITHUB_STEP_SUMMARY": print the result in the log and also on the run's summary page.
      - name: Show test coverage
        run: |
          cat */build/reports/jacoco/test/jacocoTestReport.csv \
            | awk -F, '$1 != "GROUP" { missed += $8; covered += $9 } END { if (missed + covered > 0) printf "Line coverage: %.1f%%\n", 100 * covered / (missed + covered) }' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Builds the runnable jar of the app module (jbh-iam-api). The Dockerfile copies it into the image.
      # Same env vars as the test step: Gradle may need GitHub Packages here too.
      - name: Build boot jar
        run: ./gradlew --no-daemon :jbh-iam-api:bootJar
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      # Logs Docker in to GHCR, so the next step can push.
      # GITHUB_TOKEN: GitHub creates it for each run; it is not a secret you add by hand.
      # It may push because of "packages: write" above.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds the image from the Dockerfile in the repo root and pushes it.
      # context: . -> the repo root is the build context (the Dockerfile and the boot jar).
      # push: true -> upload the image after the build.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          # One version per push. Build attestations would add untagged versions that use up the 2 kept slots.
          provenance: false
          # github.sha: the full SHA of the pushed commit.
          tags: |
            ghcr.io/kkpa-jbh/jbh-iam:${{ github.sha }}
            ghcr.io/kkpa-jbh/jbh-iam:latest

      # GitHub Free: 500 MB for private packages. Keep the 2 newest images: the running one and one to roll back to.
      # package-type: container -> the image in GHCR, not a Maven package.
      # min-versions-to-keep: 2 -> delete every version except the 2 newest.
      - name: Delete old images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: jbh-iam
          package-type: container
          min-versions-to-keep: 2
