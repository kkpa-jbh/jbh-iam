# Builds the jbh-iam image and pushes it to GHCR, tagged with the git SHA.
# jbh-gateway-client must be published to GitHub Packages first (jbh-gateway-client repo).
name: Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # PACKAGES_READ_TOKEN turns on the GitHub Packages repositories in build.gradle.kts.
      - name: Build boot jar
        run: ./gradlew --no-daemon :jbh-iam-api:bootJar
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kkpa-jbh/jbh-iam:${{ github.sha }}
            ghcr.io/kkpa-jbh/jbh-iam:latest
