# Image: tests jbh-iam, then builds its Docker image for two CPU types (amd64 and arm64)
# and pushes both to GHCR (GitHub Container Registry) under ONE tag.
#
# When it runs:
# - after every push to main (a merged PR is a push to main),
# - or by hand, with the "Run workflow" button in the Actions tab.
#
# What it changes: the GHCR package ghcr.io/kkpa-jbh/jbh-iam. It deploys nothing.
# Each image gets the git SHA tag (jbh-deploy pins it, so a deploy is exact).
# It also gets "latest", but only when its commit is still the newest on main.
#
# Jobs, in order:
# 1. package - runs the tests and builds the jar once (the jar does not depend on the CPU type).
# 2. image   - calls the reusable workflow jbh-deploy/.github/workflows/multi-arch-image.yml. It builds
#              "Build image (amd64)" and "Build image (arm64)" on native runners, publishes one tag for both,
#              and keeps the 10 newest tagged images. One file in jbh-deploy serves all 5 service repos.
#
# jbh-gateway-client must be published to GitHub Packages first (jbh-gateway-client repo).
# More: jbh-deploy/CI.md ("Image" and "Multi-arch image").

# The name shown in the GitHub "Actions" tab.
name: Image

on:
  # Adds a "Run workflow" button in the Actions tab, to build an image by hand.
  workflow_dispatch:
  # Runs on every push to main. A merged PR is a push to main, so this runs after each merge.
  push:
    branches: [ main ]

# The automatic GITHUB_TOKEN gets no permission at the top. Each job asks only for what it needs,
# so a job that only reads code cannot push images.
permissions: {}

# One run at a time for the whole repo. GitHub does not promise the order of waiting runs,
# so the reusable workflow moves "latest" only for the newest commit on main.
# - group: the workflow name only, not the branch. A run started by hand on another branch waits too.
#   Otherwise its cleanup could delete the untagged digests of a run that has not tagged them yet.
# - queue: max -> every waiting run stays in the queue (up to 100). The default (single) cancels a waiting run
#   when a newer one arrives, and that commit would never get its image.
# - cancel-in-progress: false -> a running build is never stopped halfway (that could leave pushed digests with no tag).
concurrency:
  group: ${{ github.workflow }}
  queue: max
  cancel-in-progress: false

jobs:
  # Runs the tests and builds the Spring Boot jar once. Machine: a GitHub-hosted Ubuntu VM (amd64).
  # The jar is plain Java bytecode, so the same file goes into the amd64 and the arm64 image.
  package:
    name: Test and build the app package
    runs-on: ubuntu-latest
    # Tests (two start Postgres with Testcontainers) plus the build take about 10 minutes. 30 leaves room.
    timeout-minutes: 30
    permissions:
      # Download the code. Nothing else.
      contents: read
    steps:
      # The VM starts empty. This step downloads the code of the pushed commit.
      # Actions are pinned to a full commit SHA (the version is in the comment), so a moved tag cannot change them.
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Installs Java 21 (Temurin build). Gradle runs on it; the Kotlin code still targets JVM 17.
      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # Sets up Gradle and caches its files between runs, so dependencies are not downloaded again each time.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # PACKAGES_READ_TOKEN turns on the GitHub Packages repositories in build.gradle.kts.
      # Unit tests need no network. Two integration tests start Postgres with Testcontainers (Docker is on the runner).
      # A failed test stops the run: no image is built.
      # --no-daemon: no Gradle background process; the VM is deleted after the run anyway.
      - name: Run the tests
        run: ./gradlew --no-daemon test
        env:
          # The GitHub user that started the run. build.gradle.kts uses it as the GitHub Packages user name.
          GITHUB_ACTOR: ${{ github.actor }}
          # Repo secret (Settings → Secrets and variables → Actions): a classic token with only read:packages.
          # It reads jbh-gateway-client and the notification contracts, which live in other repos' packages.
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      # Adds up the lines of all modules (JaCoCo CSV: column 8 = missed, column 9 = covered).
      # awk -F, : split each line on commas. Rows with GROUP are the header lines and are skipped.
      # tee -a "$GITHUB_STEP_SUMMARY": print the result in the log and also on the run's summary page.
      - name: Show test coverage
        run: |
          cat ./*/build/reports/jacoco/test/jacocoTestReport.csv \
            | awk -F, '$1 != "GROUP" { missed += $8; covered += $9 } END { if (missed + covered > 0) printf "Line coverage: %.1f%%\n", 100 * covered / (missed + covered) }' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Builds the runnable jar of the app module (jbh-iam-api). The Dockerfile copies it into the image.
      # Same env vars as the test step: Gradle may need GitHub Packages here too.
      - name: Build the boot jar
        run: ./gradlew --no-daemon :jbh-iam-api:bootJar
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      # Hands the jar to the image jobs (each job runs on its own VM, so files do not carry over).
      # retention-days: 1 -> the artifact is only needed during this run.
      - name: Upload the app package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-package
          path: jbh-iam-api/build/libs/*.jar
          retention-days: 1

  # Builds, tags and cleans the image, through the reusable workflow in jbh-deploy.
  # needs: package -> it waits for the tested jar (the artifact "app-package").
  # Pinned to a jbh-deploy commit SHA, like an action: a change there reaches this repo only when you bump the SHA.
  # In the Actions tab its jobs show as "Build and publish the image / Build image (amd64)", and so on.
  image:
    name: Build and publish the image
    needs: package
    # The most the called jobs may use: read the code, push and delete images in GHCR.
    permissions:
      contents: read
      packages: write
    uses: kkpa-jbh/jbh-deploy/.github/workflows/multi-arch-image.yml@8e2034e55480624e869863dbced9d10f04eb799c # JBH-86
    with:
      image: ghcr.io/kkpa-jbh/jbh-iam
      package-name: jbh-iam
      # The repo root holds the Dockerfile.
      context: .
      # The Dockerfile copies jbh-iam-api/build/libs/*.jar.
      app-package-path: jbh-iam-api/build/libs
