# Builds the jbh-iam image and pushes it to GHCR, tagged with the git SHA.
# jbh-gateway-client must be published to GitHub Packages first (jbh-gateway-client repo).
name: Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # PACKAGES_READ_TOKEN turns on the GitHub Packages repositories in build.gradle.kts.
      # Unit tests need no network. One integration test starts Postgres with Testcontainers (Docker is on the runner).
      # A failed test stops the image.
      - name: Run tests
        run: ./gradlew --no-daemon test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      # Adds up the lines of all modules (JaCoCo CSV: column 8 = missed, column 9 = covered).
      - name: Show test coverage
        run: |
          cat */build/reports/jacoco/test/jacocoTestReport.csv \
            | awk -F, '$1 != "GROUP" { missed += $8; covered += $9 } END { if (missed + covered > 0) printf "Line coverage: %.1f%%\n", 100 * covered / (missed + covered) }' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build boot jar
        run: ./gradlew --no-daemon :jbh-iam-api:bootJar
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          # One version per push. Build attestations would add untagged versions that use up the 2 kept slots.
          provenance: false
          tags: |
            ghcr.io/kkpa-jbh/jbh-iam:${{ github.sha }}
            ghcr.io/kkpa-jbh/jbh-iam:latest

      # GitHub Free: 500 MB for private packages. Keep the 2 newest images: the running one and one to roll back to.
      - name: Delete old images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: jbh-iam
          package-type: container
          min-versions-to-keep: 2
